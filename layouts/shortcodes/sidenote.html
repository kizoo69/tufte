{{- $id := printf "sidenote-%d" .Ordinal -}}
<label for="{{ $id }}" class="margin-toggle sidenote-number"></label>
<input type="checkbox" id="{{ $id }}" class="margin-toggle" />
<span class="sidenote" {{ with .Get "lang" }} lang="{{ . }}" {{ end }}>{{ (.Inner | markdownify | replaceRE `</p>\s*<p>` "<br><br>" | replaceRE `^<p>` "" | replaceRE `</p>\s*$` "") | safeHTML }}</span>
